    <!-- Main Contact Section -->
    <div class="max-w-6xl mx-auto px-4 py-12">

            <!-- Send Message Form -->

                <!-- ফর্মের মধ্যে onsubmit যোগ করা হয়েছে -->
                <form onsubmit="handleContactSubmit(event)" class="space-y-4">
                    <div>
                        <input type="text" placeholder="Your Name" required class="w-full px-4 py-3 border border-slate-200 rounded-xl text-sm focus:outline-none focus:border-[#F26522]">
                    </div>
                    <div>
                        <input type="email" placeholder="Your Email" required class="w-full px-4 py-3 border border-slate-200 rounded-xl text-sm focus:outline-none focus:border-[#F26522]">
                    </div>
                    <div>
                        <textarea placeholder="Your Message..." rows="4" required class="w-full px-4 py-3 border border-slate-200 rounded-xl text-sm focus:outline-none focus:border-[#F26522]"></textarea>
                    </div>
                    <button type="submit" class="w-full bg-[#F26522] hover:bg-orange-600 text-white font-bold py-3 rounded-xl transition text-sm">

    <!-- ১. ফায়ারবেস সিডিএন লাইব্রেরি (Compat ভার্সন) -->

    <!-- ৪. আপনার মূল লজিক ও কন্টাক্ট ফর্ম সাবমিট হ্যান্ডেলার ফাইল -->
    <script src="script.js"></script>

    <!-- কন্টাক্ট ফর্ম ডাটা ফায়ারবেসে সেভ করার স্ক্রিপ্ট -->
    <script>
        // যদি আপনার মূল logic কোড (script.js)-এ এই ফাংশনটি আগে থেকেই না থাকে, তবে এটি ব্যবহার করতে পারেন:
        window.handleContactSubmit = async function(e) {
            e.preventDefault();

            const nameInput = e.target.querySelector('input[type="text"]');
            const emailInput = e.target.querySelector('input[type="email"]');
            const messageInput = e.target.querySelector('textarea');
            const submitBtn = e.target.querySelector('button[type="submit"]');

            const name = nameInput ? nameInput.value.trim() : '';
            const email = emailInput ? emailInput.value.trim() : '';
            const message = messageInput ? messageInput.value.trim() : '';

            if (!name || !email || !message) {
                alert('দয়া করে সব ফিল্ডগুলো পূরণ করুন।');
                return;
            }

            if (submitBtn) {
                submitBtn.disabled = true;
                submitBtn.innerHTML = '<i class="fa-solid fa-spinner fa-spin mr-1"></i> Sending...';
            }

            try {
                // ফায়ারবেস কমপ্যাট ভার্সন ব্যবহার করে ডাটা সেভ করা
                await firebase.firestore().collection("messages").add({
                    name: name,
                    email: email,
                    message: message,
                    timestamp: firebase.firestore.FieldValue.serverTimestamp()
                });

                alert('আপনার মেসেজটি সফলভাবে পাঠানো হয়েছে! ধন্যবাদ। 🚀');
                e.target.reset();
            } catch (error) {
                console.error("মেসেজ পাঠাতে সমস্যা হয়েছে: ", error);
                alert('মেসেজ পাঠানো সম্ভব হয়নি। আবার চেষ্টা করুন।');
            } finally {
                if (submitBtn) {
                    submitBtn.disabled = false;
                    submitBtn.innerHTML = 'Submit';
                }
            }
        }
    </script>
